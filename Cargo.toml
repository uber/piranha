[workspace]
members = ["crates/core", "crates/concrete-syntax"]
resolver = "2"

[workspace.package]
version = "0.4.9"
edition = "2021"
authors = ["Uber Technologies Inc."]
license-file = "LICENSE"

# Workspace-level dependencies that can be inherited by member crates
[workspace.dependencies]
# Core dependencies
serde = "1.0.136"
serde_derive = "1.0.136"
serde_json = "1.0.82"
regex = "1.11.1"

# Optimize native query analysis in tests; Piranha keeps debug assertions.
[profile.test.package.tree-sitter]
opt-level = 2
